[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-text-collection"
version = "0.2.0"
description = "Local Project Amber simplified-Chinese text collection tools"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<0.29",
    "rich>=14,<15",
    "typer>=0.25,<0.26",
    "Flask>=3.1,<3.2",
    "nbformat>=5.11,<6",
]

[project.scripts]
genshin-text = "genshin_text.cli:app"

[tool.setuptools.packages.find]
include = ["genshin_text*"]
