{% extends "base.html" %}
{% block title %}{{ row.title }} - 原神文本收藏{% endblock %}
{% block content %}
<div class="toolbar no-print">
  <a class="button ghost" href="{{ back_href }}">返回</a>
  <a class="button ghost" href="{{ pdf_href }}" target="_blank">导出 PDF</a>
</div>
<article class="article-card">
  <p class="category">{{ row.category }}</p>
  <h1>{{ row.title }}</h1>
  <div class="ornament">◆</div>
  <div class="content">{{ body_html|safe }}</div>
  <p class="source">来源：<a href="{{ row.source_url }}">{{ row.source_url }}</a></p>
</article>
{% endblock %}
